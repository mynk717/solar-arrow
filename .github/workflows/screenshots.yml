name: Capture Screenshots
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @sparticuz/chromium puppeteer-core

      - name: Install Chromium system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libnspr4 libnss3 libglib2.0-0 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 \
            libasound2t64 libx11-6 libxext6 libxfixes3

      - name: Run screenshot capture
        run: node scripts/capture-screenshots.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: solar-arrow-screenshots
          path: docs/screenshots/
          retention-days: 30
